<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator - FitTrack Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">BMI Calculator</span>
        <a href="/dashboard/" class="btn btn-outline-light btn-sm">Dashboard</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="col-md-5 mx-auto">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="text-center mb-4">Calculate BMI</h3>

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label>Height (cm)</label>
                        <input type="number" step="0.1" name="height" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Weight (kg)</label>
                        <input type="number" step="0.1" name="weight" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-info w-100">Calculate BMI</button>
                </form>

                {% if bmi_value %}
                <div class="alert alert-success mt-4 text-center">
                    <h4>Your BMI: {{ bmi_value }}</h4>
                    <p class="mb-0">Category: <strong>{{ category }}</strong></p>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>

</body>
</html>
