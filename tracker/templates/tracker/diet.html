<!DOCTYPE html>
<html>
<head>
    <title>Diet Tracker - FitTrack Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Diet Tracker</span>
        <a href="/dashboard/" class="btn btn-outline-light btn-sm">Dashboard</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4>Add Meal</h4>

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label>Food Name</label>
                            <input type="text" name="food_name" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Calories</label>
                            <input type="number" name="calories" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Protein (grams)</label>
                            <input type="number" step="0.1" name="protein" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Add Meal
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <h4>Your Diet History</h4>

            <table class="table table-bordered table-striped mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>Food</th>
                        <th>Calories</th>
                        <th>Protein</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>
                    {% for diet in diets %}
                    <tr>
                        <td>{{ diet.date }}</td>
                        <td>{{ diet.food_name }}</td>
                        <td>{{ diet.calories }}</td>
                        <td>{{ diet.protein }} g</td>
                        <td>
                            <a href="/delete-diet/{{ diet.id }}/"
                               class="btn btn-danger btn-sm">
                               Delete
                            </a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="5" class="text-center">
                            No meals added yet
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>
        </div>

    </div>
</div>

</body>
</html>
