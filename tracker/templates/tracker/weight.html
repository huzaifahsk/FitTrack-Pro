<!DOCTYPE html>
<html>
<head>
    <title>Weight Progress - FitTrack Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Weight Progress Tracker</span>
        <a href="/dashboard/" class="btn btn-outline-light btn-sm">Dashboard</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4>Add Weight</h4>

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label>Current Weight (kg)</label>
                            <input type="number" step="0.1" name="weight" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-warning w-100">Add Weight</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <h4>Your Weight History</h4>

            <table class="table table-bordered table-striped mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>Weight</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>
                    {% for weight in weights %}
<tr>
    <td>{{ weight.date }}</td>
    <td>{{ weight.weight }} kg</td>
    <td>
        <a href="/delete-weight/{{ weight.id }}/"
           class="btn btn-danger btn-sm">
           Delete
        </a>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="3" class="text-center">
        No weight records added yet
    </td>
</tr>
{% endfor %}
                </tbody>
            </table>
        </div>

    </div>
</div>

</body>
</html>
