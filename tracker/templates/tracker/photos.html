<!DOCTYPE html>
<html>
<head>
    <title>Progress Photos - FitTrack Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Progress Photos</span>
        <a href="/dashboard/" class="btn btn-outline-light btn-sm">Dashboard</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h4>Upload Progress Photo</h4>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label>Select Photo</label>
                    <input type="file" name="photo" class="form-control" accept="image/*" required>
                </div>

                <button type="submit" class="btn btn-danger">Upload Photo</button>
            </form>
        </div>
    </div>

    <h4>Your Progress Photos</h4>

    <div class="row mt-3">
        {% for photo in photos %}
        <div class="col-md-3 mb-4">
            <div class="card shadow-sm">
                <img src="{{ photo.photo.url }}" class="card-img-top" style="height: 220px; object-fit: cover;">
                <div class="card-body">
                    <p class="text-muted mb-2">{{ photo.date }}</p>
                    <a href="/delete-photo/{{ photo.id }}/" class="btn btn-danger btn-sm">
    Delete
                    </a>
                </div>
            </div>
        </div>
        {% empty %}
        <p>No photos uploaded yet.</p>
        {% endfor %}
    </div>

</div>

</body>
</html>
