<!DOCTYPE html>
<html>
<head>
    <title>Workout Tracker - FitTrack Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Workout Tracker</span>
        <a href="/dashboard/" class="btn btn-outline-light btn-sm">Dashboard</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4>Add Workout</h4>

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label>Exercise Name</label>
                            <input type="text" name="exercise" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Sets</label>
                            <input type="number" name="sets" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Reps</label>
                            <input type="number" name="reps" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Add Workout</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <h4>Your Workout History</h4>

            <table class="table table-bordered table-striped mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>Exercise</th>
                        <th>Sets</th>
                        <th>Reps</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>
                    {% for workout in workouts %}
                    <tr>
                        <td>{{ workout.date }}</td>
                        <td>{{ workout.exercise }}</td>
                        <td>{{ workout.sets }}</td>
                        <td>{{ workout.reps }}</td>
                        <td>
    <a href="/delete-workout/{{ workout.id }}/" class="btn btn-danger btn-sm">Delete</a>
</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center">No workouts added yet</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    </div>
</div>

</body>
</html>
